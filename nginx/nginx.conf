# ─────────────────────────────────────────────────────────────────────────────
# V2Hub Mini App — nginx production config
#
# Expects:
#   - App running on app:8000 (or Docker: v2hub_app:8000)
#   - TLS certs managed by Certbot at /etc/letsencrypt/live/$DOMAIN/
#   - Static files at /opt/v2hub/app/frontend/ (served directly by nginx)
# ─────────────────────────────────────────────────────────────────────────────

upstream v2hub_backend {
    server app:8000;
    keepalive 32;
}

# Rate limit zones (per client IP)
limit_req_zone $binary_remote_addr zone=api:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=sub:10m  rate=3r/s;

# ── HTTP: redirect to HTTPS + Certbot ACME challenge ─────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name panel.v2hub.link www.panel.v2hub.link;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: main server ────────────────────────────────────────────────────────
server {
    listen 443      ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.v2hub.link www.panel.v2hub.link;

    # TLS — certificates managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/panel.v2hub.link/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.v2hub.link/privkey.pem;

    # Mozilla "Intermediate" TLS config (TLS 1.2 + 1.3)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/panel.v2hub.link/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=60s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;

    # Compression
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_vary       on;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;


    # ── Public subscription endpoint ──────────────────────────────────────────
    location ~ ^/sub/ {
        limit_req zone=sub burst=10 nodelay;
        limit_req_status 429;

        proxy_pass         http://v2hub_backend;
        include            /etc/nginx/proxy_params;
    }

    # ── API endpoints ─────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://v2hub_backend;
        include            /etc/nginx/proxy_params;
    }

    # ── Health check (no rate limit, no logging) ──────────────────────────────
    location = /api/health {
        proxy_pass http://v2hub_backend;
        include    /etc/nginx/proxy_params;
        access_log off;
    }

    # ── Frontend SPA ──────────────────────────────────────────────────────────
    location / {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://v2hub_backend;
        include            /etc/nginx/proxy_params;
    }

    # ── 429 JSON response ─────────────────────────────────────────────────────
    error_page 429 @too_many;
    location @too_many {
        default_type application/json;
        return 429 '{"detail":"Too many requests. Please slow down."}';
    }
}
