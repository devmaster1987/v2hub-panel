[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "v2hub-panel"
version = "1.0.1"
description = "Web management panel for V2Hub subscriptions"
readme = "README.md"
license = { text = "MIT" }

authors = [
    { name = "nestt", email = "nestt@tutamail.com" }
]

requires-python = ">=3.11"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

keywords = [
    "v2hub",
    "vpn",
    "fastapi",
    "panel",
    "web",
    "subscription",
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "Pillow>=11.0,<12.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "pydantic-settings>=2.6,<3.0",
    "qrcode>=8.0,<9.0",
    "uvicorn>=0.32,<1.0",
    "v2hub>=1.0.8",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "types-qrcode>=8.2.0.20260518",
]

# Если есть CLI
[project.scripts]
v2hub-panel = "v2hub_panel.main:cli"

[project.urls]
Homepage = "https://github.com/nestthub/v2hub-panel"
Documentation = "https://github.com/nestthub/v2hub-panel#readme"
Repository = "https://github.com/nestthub/v2hub-panel"
Issues = "https://github.com/nestthub/v2hub-panel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/v2hub_panel"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "ARG",
    "SIM",
    "TCH",
    "PTH",
    "RUF",
]

ignore = [
    "E722",
    "E501",
    "B008",
    "ARG002",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "F401",
    "F403",
]

"tests/*" = [
    "ARG001",
    "ARG002",
]

[tool.ruff.lint.isort]
known-first-party = [
    "v2hub_panel",
    "v2hub",
]

[tool.mypy]
python_version = "3.11"

strict = true
warn_return_any = true
warn_unused_configs = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

no_implicit_optional = true

warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

strict_equality = true

plugins = [
    "pydantic.mypy",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = [
    "v2hub_panel",
]

omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]
