[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "v2hub-panel"
version = "1.0.1"
description = "Web management panel for V2Hub subscriptions"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "nestt", email = "nestt@tutamail.com" }
]
requires-python = ">=3.10"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

keywords = [
    "v2hub",
    "vpn",
    "fastapi",
    "panel",
    "web",
    "subscription",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "prometheus-fastapi-instrumentator",
    "qrcode",
    "Pillow",
    "v2hub>=1.0.6",
]

[project.urls]
Homepage = "https://github.com/nestthub/v2hub-panel"
Documentation = "https://github.com/nestthub/v2hub-panel#readme"
Repository = "https://github.com/nestthub/v2hub-panel"
Issues = "https://github.com/nestthub/v2hub-panel/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app/src/app"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["app/src"]

select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "PTH",
    "RUF",
]

ignore = [
    "E501",
    "B008",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["ARG001", "ARG002"]

[tool.ruff.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]

strict = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
